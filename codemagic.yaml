workflows:
  ios-testflight:
    name: iOS — TestFlight build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Pregame        # shared ASC API integration for all athlete-domains apps
    environment:
      # No variable groups needed — `integrations: app_store_connect: Pregame`
      # above injects the ASC credentials. Add a group here only when an app
      # needs custom encrypted env vars (e.g. REVENUECAT_API_KEY).
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.athletedomains.settleThis
      vars:
        APP_STORE_APPLE_ID: "6768496159"
        BUNDLE_ID: com.athletedomains.settleThis
        APPLE_TEAM_ID: Q3UH3Y4QUU
        # REVENUECAT_API_KEY left undeclared — passed as empty literal to
        # flutter build below. Add as a Codemagic secret env var when
        # RevenueCat is wired.
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Resolve Flutter deps
        working_directory: settle_this
        script: flutter pub get
      - name: Pod install
        working_directory: settle_this/ios
        script: pod install
      - name: Increment build number + build IPA
        working_directory: settle_this
        script: |
          BUILD_NUMBER=$(($(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID") + 1))
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=REVENUECAT_API_KEY="${REVENUECAT_API_KEY:-}" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - settle_this/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

  android-debug:
    name: Android — debug APK
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Resolve Flutter deps
        working_directory: settle_this
        script: flutter pub get
      - name: Build debug APK
        working_directory: settle_this
        script: |
          flutter build apk --debug \
            --dart-define=REVENUECAT_API_KEY="${REVENUECAT_API_KEY:-}"
    artifacts:
      - settle_this/build/app/outputs/apk/debug/*.apk
